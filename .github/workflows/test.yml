name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: |
          find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --check sw.js

      - name: Check required application files
        run: |
          required_files=(
            index.html
            star-ups.html
            investments.html
            wiki.html
            community-data.html
            manifest.webmanifest
            sw.js
            .nojekyll
            css/style.css
            css/responsive.css
            css/dashboard.css
            css/investments.css
            css/investments-legacy-tree.css
            css/community-data.css
            src/app/dashboard.js
            src/app/starups.js
            src/app/investments.js
            src/app/pwa.js
            src/app/community-data.js
            scripts/build-community-feed.mjs
            scripts/export-approved-submission.mjs
            .github/workflows/backup.yml
            .github/workflows/community-data.yml
            .github/workflows/community-review.yml
            .github/ISSUE_TEMPLATE/investment_data_submission.yml
            .github/ISSUE_TEMPLATE/star_up_data_submission.yml
            .github/ISSUE_TEMPLATE/wiki_tip_correction.yml
            data/community/approved/README.md
            LICENSE
            README.md
            SECURITY.md
            CONTRIBUTING.md
            CHANGELOG.md
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done
