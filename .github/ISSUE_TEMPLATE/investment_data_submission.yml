name: Submit Investment data
description: Submit Investment level data for verification before it is added to TGM Companion
title: "[Data][Investment]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the TGM Companion dataset.

        Submitted values are **unverified source data** until they are cross-checked against screenshots and/or multiple independent submissions.

        **Time rule:** enter the **original/base investment time shown by the game**. Do not enter a time reduced by your personal Investment Buff, VIP level, Family Help, or any other speed modifier.

  - type: input
    id: category
    attributes:
      label: Investment category
      description: Enter the investment tree/category.
      placeholder: "Freight Truck"
    validations:
      required: true

  - type: input
    id: investment
    attributes:
      label: Investment name
      placeholder: "Extra Run"
    validations:
      required: true

  - type: input
    id: level
    attributes:
      label: Investment level
      description: Enter the exact level these values belong to.
      placeholder: "1"
    validations:
      required: true

  - type: input
    id: original_time
    attributes:
      label: Original investment time shown by the game
      description: Enter the unmodified base time exactly as shown in-game, not your buffed or reduced time.
      placeholder: "Example: 12d 03:04:05"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Resources, Gold, and Influence
        Enter every value exactly as shown for this level. Use `0` only when confirmed by the game and `Unknown` when a value cannot yet be verified.

  - type: input
    id: cash
    attributes:
      label: Cash
      placeholder: "Example: 33,480,002"
    validations:
      required: true

  - type: input
    id: arms
    attributes:
      label: Arms
      placeholder: "Example: 11,016,001"
    validations:
      required: true

  - type: input
    id: cargo
    attributes:
      label: Cargo
      placeholder: "Example: 11,664,001"
    validations:
      required: true

  - type: input
    id: metal
    attributes:
      label: Metal
      placeholder: "Example: 14,040,001"
    validations:
      required: true

  - type: input
    id: diamonds
    attributes:
      label: Diamonds
      placeholder: "Example: 21,600,001"
    validations:
      required: true

  - type: input
    id: oil
    attributes:
      label: Oil
      placeholder: "Example: 0"
    validations:
      required: true

  - type: input
    id: crypto_coins
    attributes:
      label: Crypto Coins
      placeholder: "Example: 0"
    validations:
      required: true

  - type: input
    id: family_currency
    attributes:
      label: Family Currency
      placeholder: "Example: 0"
    validations:
      required: true

  - type: input
    id: family_insignia
    attributes:
      label: Family Insignia
      placeholder: "Example: 0"
    validations:
      required: true

  - type: input
    id: gold
    attributes:
      label: Gold
      description: Enter the known Gold value, or `Unknown` when it is not yet verified.
      placeholder: "Unknown"
    validations:
      required: true

  - type: input
    id: influence
    attributes:
      label: Influence
      placeholder: "Example: 152,043"
    validations:
      required: true

  - type: textarea
    id: prerequisites
    attributes:
      label: Prerequisites / dependencies
      description: List every required investment or building and its required level. Enter None when there are no prerequisites.
      placeholder: |
        Lucky Hijack Lv. 5
        Lucky Recovery Lv. 5
        Investment Center Lv. 10
    validations:
      required: true

  - type: upload
    id: evidence
    attributes:
      label: Screenshots / evidence
      description: Upload screenshots showing the investment, level, original time, resources, and prerequisites so the values can be independently verified.
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission confirmation
      options:
        - label: I entered source values from the specified investment level and the submitted time is the original/base game time, not my personally buffed or reduced time.
          required: true
