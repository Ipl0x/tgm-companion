name: Feature request
description: Suggest an improvement for TGM Companion
title: "[Feature]: "
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard
        - Building Star-Ups
        - Investments
        - PWA installation or offline mode
        - Import, export, or saved progress
        - Repository or documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: Explain what is currently difficult or missing.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or output you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention any other approach you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots, or relevant game-data details.
