name: Submit Star-Up data
description: Submit Building Star-Up data for verification before it is added to TGM Companion
title: "[Data][Star-Up]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the TGM Companion Star-Up dataset.

        Submitted values are **unverified source data** until they are cross-checked against screenshots and/or multiple independent submissions.

        Enter all values **exactly as shown by the game** for the specific building and Star-Up step.

  - type: input
    id: building
    attributes:
      label: Building name
      placeholder: "Mansion"
    validations:
      required: true

  - type: input
    id: current_star
    attributes:
      label: Current completed star level
      description: Enter the building's completed star level immediately before this upgrade step.
      placeholder: "Example: 8"
    validations:
      required: true

  - type: input
    id: target_step
    attributes:
      label: Target Star-Up level / step
      description: Enter the exact next Star-Up level or intermediate step shown by the game.
      placeholder: "Example: Star 9 or the exact intermediate step"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Star-Up costs
        Enter the exact values shown for this step. Use `0` only when confirmed by the game and `Unknown` when a value cannot yet be verified.

  - type: input
    id: family_currency
    attributes:
      label: Family Currency
      placeholder: "Example: 1,234,567"
    validations:
      required: true

  - type: input
    id: family_insignia
    attributes:
      label: Family Insignia
      placeholder: "Example: 12,345"
    validations:
      required: true

  - type: textarea
    id: prerequisites
    attributes:
      label: Required buildings / prerequisites
      description: List every building prerequisite and required star level shown for this Star-Up step. Enter None when there are no prerequisites.
      placeholder: |
        Family Council Star 8
        Wall Star 8
    validations:
      required: true

  - type: upload
    id: evidence
    attributes:
      label: Screenshots / evidence
      description: Upload screenshots showing the building, exact Star-Up step, costs, and prerequisites so the values can be independently verified.
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission confirmation
      options:
        - label: I entered source values from the specified building and Star-Up step, and the uploaded evidence corresponds to those values.
          required: true
