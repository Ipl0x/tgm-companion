name: Submit Star-Up data
description: Submit Building Star-Up data for verification before it is added to TGM Companion
title: "[Data][Star-Up]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the TGM Companion Star-Up dataset.

        Submitted values are **unverified source data** until they are cross-checked against screenshots and/or multiple independent submissions.

        Enter all values **exactly as shown by the game** for the specific building and Star-Up step.

  - type: input
    id: building
    attributes:
      label: Building name
      placeholder: Mansion
    validations:
      required: true

  - type: input
    id: star_step
    attributes:
      label: Star-Up level / step
      description: Enter the completed level and the exact target or intermediate Star-Up step shown by the game.
      placeholder: "Example: Star 8 -> Star 9, or the exact intermediate step"
    validations:
      required: true

  - type: textarea
    id: costs
    attributes:
      label: Star-Up costs
      description: Enter the exact costs shown for this step. Use 0 only when confirmed by the game and Unknown when not yet verified.
      placeholder: |
        Family Currency: 
        Family Insignia: 
    validations:
      required: true

  - type: textarea
    id: prerequisites
    attributes:
      label: Required buildings / prerequisites
      description: List every building prerequisite and required star level shown for this Star-Up step. Enter None when there are no prerequisites.
      placeholder: |
        Family Council Star 8
        Wall Star 8
    validations:
      required: true

  - type: upload
    id: evidence
    attributes:
      label: Screenshots / evidence
      description: Upload screenshots showing the building, exact Star-Up step, costs, and prerequisites so the values can be independently verified.
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission confirmation
      options:
        - label: I entered source values from the specified building and Star-Up step, and the uploaded evidence corresponds to those values.
          required: true
